<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FacePass web demo</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 2rem auto; max-width: 34rem; padding: 0 1rem; line-height: 1.5; }
      video, img { background: #222; border-radius: 0.5rem; display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
      video { transform: scaleX(-1); }
      label { display: block; margin-top: 1rem; }
      input[type="text"], select { box-sizing: border-box; font: inherit; padding: 0.5rem; width: 100%; }
      button { font: inherit; margin-top: 1rem; padding: 0.6rem 1.2rem; }
      [role="status"] { font-weight: 600; margin-top: 1rem; min-height: 1.5rem; }
      pre { background: rgb(127 127 127 / 15%); border-radius: 0.5rem; overflow: auto; padding: 1rem; }
    </style>
  </head>
  <body>
    <h1>FacePass web demo</h1>
    <video id="video" autoplay playsinline muted aria-label="Camera preview"></video>
    <button id="camera" type="button">Start camera</button>

    <label>
      Action
      <select id="action">
        <option value="enroll">Enroll</option>
        <option value="verify">Verify</option>
        <option value="identify">Identify</option>
      </select>
    </label>
    <label id="username-field">
      Username
      <input id="username" type="text" value="demo-user" autocomplete="off" />
    </label>
    <label id="consent-field">
      <input id="consent" type="checkbox" />
      I agree to my face being processed and stored for this demo.
    </label>
    <label>
      Or use a photo file instead of the camera
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" />
    </label>

    <button id="submit" type="button">Capture and send</button>
    <p id="status" role="status"></p>
    <pre id="result" hidden></pre>

    <script>
      const FACEPASS_URL = "__FACEPASS_URL__";
      const $ = (id) => document.getElementById(id);
      const video = $("video");

      function updateFields() {
        const action = $("action").value;
        $("username-field").hidden = action === "identify";
        $("consent-field").hidden = action !== "enroll";
      }
      $("action").addEventListener("change", updateFields);
      updateFields();

      $("camera").addEventListener("click", async () => {
        try {
          video.srcObject = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1280 } },
          });
        } catch (error) {
          $("status").textContent = `Camera unavailable: ${error.message}`;
        }
      });

      function capture() {
        const file = $("file").files[0];
        if (file) return Promise.resolve(file);
        if (!video.videoWidth) return Promise.reject(new Error("Start the camera or choose a photo."));
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.92));
      }

      async function pollResult(id) {
        // A real backend would usually wait for the webhook rather than poll.
        for (let attempt = 0; attempt < 10; attempt += 1) {
          const response = await fetch(`/api/sessions/${id}`);
          const session = await response.json();
          if (session.status !== "pending") return session;
          await new Promise((resolve) => setTimeout(resolve, 500));
        }
        throw new Error("Timed out waiting for the result.");
      }

      $("submit").addEventListener("click", async () => {
        $("submit").disabled = true;
        $("result").hidden = true;
        $("status").textContent = "Working…";
        try {
          const image = await capture();
          const started = await fetch("/api/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: $("action").value,
              username: $("username").value,
              consent: $("consent").checked,
            }),
          });
          const session = await started.json();
          if (!started.ok) throw new Error(session.detail ?? session.title);

          const form = new FormData();
          form.append("image", image, "face.jpg");
          const submitted = await fetch(`${FACEPASS_URL}/v1/sessions/submit`, {
            method: "POST",
            headers: { Authorization: `Bearer ${session.token}` },
            body: form,
          });
          if (!submitted.ok) {
            const problem = await submitted.json();
            throw new Error(problem.detail ?? problem.title);
          }

          const outcome = await pollResult(session.id);
          $("status").textContent = `Session ${outcome.status}`;
          $("result").textContent = JSON.stringify(outcome.result, null, 2);
          $("result").hidden = false;
        } catch (error) {
          $("status").textContent = error.message;
        } finally {
          $("submit").disabled = false;
        }
      });
    </script>
  </body>
</html>
