name: facepass

x-app: &app
  build: .
  image: facepass-api:local
  env_file: .env
  environment:
    FACEPASS_DATABASE_URL: postgresql+psycopg://facepass:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/facepass
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: facepass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: facepass
    ports:
      - "127.0.0.1:${FACEPASS_DB_PORT:-5436}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facepass -d facepass"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:${FACEPASS_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as r; r.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: ["facepass-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
