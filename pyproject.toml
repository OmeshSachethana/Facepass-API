[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "facepass-api"
version = "0.1.0"
description = "Multi-tenant face recognition API for web and mobile applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "cryptography>=43",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "opencv-python-headless>=5,<6",
    "pgvector>=0.3,<1",
    "pillow>=11",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
]

[project.scripts]
facepass = "facepass.cli:main"
facepass-worker = "facepass.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/facepass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["models: needs the downloaded ONNX model files"]

[tool.coverage.run]
source = ["facepass"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S", "RUF"]
# B008: FastAPI's Depends()/File() defaults are the framework's documented style.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2.*", "onnxruntime.*", "pgvector.*"]
ignore_missing_imports = true
follow_imports = "skip"
